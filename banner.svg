<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13191F"/>
      <stop offset="55%" stop-color="#2B2F2E"/>
      <stop offset="100%" stop-color="#594C3D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CA9C68" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CA9C68" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#CA9C68" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- distant treeline -->
  <g fill="#2B2F2E" opacity="0.7">
    <polygon points="0,320 0,240 40,180 80,240 120,190 160,250 200,210 240,260 280,220 320,270 320,320"/>
    <polygon points="320,320 320,260 360,200 400,255 440,215 480,265 520,225 560,270 600,230 640,275 680,235 680,320"/>
    <polygon points="680,320 680,270 720,215 760,260 800,220 840,265 880,225 920,270 960,235 1000,275 1040,230 1040,320"/>
    <polygon points="1040,320 1040,275 1080,225 1120,265 1160,235 1200,270 1200,320"/>
  </g>

  <!-- nearer treeline -->
  <g fill="#594C3D" opacity="0.85">
    <polygon points="0,320 0,270 30,220 60,270 90,230 120,280 150,240 180,290 210,250 240,300 240,320"/>
    <polygon points="240,320 240,290 280,235 320,285 360,245 400,295 440,255 480,300 520,265 560,310 600,270 600,320"/>
    <polygon points="600,320 600,270 640,255 680,300 720,260 760,305 800,265 840,310 880,270 920,315 960,275 960,320"/>
    <polygon points="960,320 960,275 1000,265 1040,305 1080,270 1120,310 1160,280 1200,315 1200,320"/>
  </g>

  <!-- fireflies -->
  <g fill="#CA9C68">
    <circle cx="150" cy="140" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="110" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="160" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="90" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="70" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="Courier New, monospace" font-size="52" font-weight="700" fill="#CA9C68" letter-spacing="4">RUDAINA HAITHAM</text>
  <text x="600" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#906D4B" letter-spacing="2">DATA SCIENCE &amp; ARTIFICIAL INTELLIGENCE</text>
</svg>
